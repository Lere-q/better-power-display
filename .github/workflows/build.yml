# The build: the plugin compiled into Tessera's real firmware on every kind of screen (docs/PREVIEW.md), and, when
# that passes on main, a GitHub release at the version in tessera-plugin.yaml. Tessera takes the newest release of a
# linked repository, so a push that raises the version becomes an update on the screens by itself.
name: build

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - ".gitignore"
      - "LICENSE"
      - "store.png"
      - ".github/**"
  pull_request:
    paths:
      - "components/**"
      - "tessera-plugin.yaml"
      - "plugin.yaml"
      - "preview.yaml"
      - "translations/**"
  workflow_dispatch:
    inputs:
      boards:
        description: "Bench boards (empty: the four default screens; e.g. cyd, guition)"
        default: ""

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bench:
    name: firmware bench
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: "The plugins repository: the bench and its tools"
        uses: actions/checkout@v4
        with:
          repository: MaxGramser/tessera-plugins
          path: tessera-plugins

      - name: SDL2 and a compiler, what the bench builds with
        run: sudo apt-get update && sudo apt-get install -y build-essential libsdl2-dev

      - uses: astral-sh/setup-uv@v5

      - name: The bench's Python and its copy of Tessera
        uses: actions/cache@v4
        with:
          path: |
            tessera-plugins/tools/.cache
            ~/.cache/uv
          key: bench-${{ runner.os }}-${{ github.run_id }}
          restore-keys: bench-${{ runner.os }}-

      - name: A fresh bench Python (the cache keeps its packages)
        run: rm -rf tessera-plugins/tools/.cache/preview-venv

      - name: Build the screens and audit what it draws
        env:
          BOARDS: ${{ inputs.boards }}
          EVENT: ${{ github.event_name }}
        run: |
          args=""
          if [ -n "$BOARDS" ]; then
            args="--board $BOARDS"
          elif [ "$EVENT" = "pull_request" ]; then
            args="--board cyd"   # the quickest screen while a pull request still changes
          fi
          python3 tessera-plugins/tools/preview.py . --strict $args

      - name: Keep the pictures and the findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview
          path: .preview/
          if-no-files-found: ignore

  release:
    name: release
    needs: bench
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read the version and the changelog
        id: release
        run: python3 .github/scripts/release.py

      - name: Publish the release
        if: steps.release.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "v${{ steps.release.outputs.version }}"
          --title "v${{ steps.release.outputs.version }}"
          --notes-file .release-notes.md
          --target "$GITHUB_SHA"
